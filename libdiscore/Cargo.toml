[package]
name = "libdiscore"
version = "0.1.0"
edition = "2021"
description = "1:1 Rust reconstruction of data/libdiscore.wasm (see data/libdiscore.c listing)"
license = "MIT"

[features]
default = ["serde"]
# `web` gates the wasm-bindgen guest FFI surface (exports with the exact names
# present in data/libdiscore.wasm). Host builds never require it.
web = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
sha2 = "0.10"
url = "2"

# wasm-bindgen is only needed by the `web` FFI surface.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "0.6.5"
js-sys = "=0.3.77"
wasm-streams = "=0.4.2"
futures-util = { version = "0.3", features = ["io", "sink"] }
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = ["Cache", "CacheStorage", "Headers", "Request", "RequestInit", "Response", "ResponseInit", "Window"] }

[lib]
name = "libdiscore"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
